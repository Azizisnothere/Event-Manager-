<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://localhost:*; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Create organizer account - Event Manager</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="../index.html">Event <span>Manager</span></a></header>
  <main class="container container-narrow">
    <form id="register-form" class="card auth-card" novalidate>
      <h1>Create an organizer account</h1>
      <div id="register-error" hidden></div>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
        <div class="field-hint">At least 10 characters.</div>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      </div>
      <button class="btn btn-block" type="submit">Create account</button>
      <p class="small muted center">Already registered? <a href="../index.html">Log in</a></p>
    </form>
  </main>
  <script src="../shared/config.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
