<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://localhost:*; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Event details - Event Manager</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html">Event <span>Manager</span></a>
    <div class="topbar-right" id="user-area"></div>
  </header>
  <main class="container">
    <p><a href="dashboard.html">&larr; My events</a></p>
    <div id="page-error" hidden></div>
    <div id="flash" class="alert alert-warn" hidden></div>
    <section id="event-summary" class="card" aria-live="polite"></section>
    <nav class="tabs" role="tablist" aria-label="Event sections">
      <button class="tab" role="tab" type="button" data-tab="guests" aria-selected="true">Guest list</button>
      <button class="tab" role="tab" type="button" data-tab="rsvps" aria-selected="false">RSVPs</button>
      <button class="tab" role="tab" type="button" data-tab="waitlist" aria-selected="false">Waitlist</button>
      <button class="tab" role="tab" type="button" data-tab="companions" aria-selected="false">Companion requests</button>
      <button class="tab" role="tab" type="button" data-tab="staff" aria-selected="false">Staff</button>
      <button class="tab" role="tab" type="button" data-tab="live" aria-selected="false">Live attendance</button>
      <button class="tab" role="tab" type="button" data-tab="report" aria-selected="false">Report</button>
    </nav>
    <section id="tab-panel" class="tab-panel" role="tabpanel"></section>
  </main>
  <script src="../shared/config.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="js/common.js"></script>
  <script src="js/tabs/guests.js"></script>
  <script src="js/tabs/rsvps.js"></script>
  <script src="js/tabs/waitlist.js"></script>
  <script src="js/tabs/companions.js"></script>
  <script src="js/tabs/staff.js"></script>
  <script src="js/tabs/live.js"></script>
  <script src="js/tabs/report.js"></script>
  <script src="js/event.js"></script>
</body>
</html>
