<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://localhost:*; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Set your password - Event Manager</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="../index.html">Event <span>Manager</span></a><span class="muted small">Door staff</span></header>
  <main class="container container-narrow">
    <form id="setup-form" class="card auth-card" novalidate>
      <h1>Set your password</h1>
      <p class="muted">Choose a password for your door-staff account. This link works once and expires 48 hours after it was sent.</p>
      <div id="setup-error" hidden></div>
      <div id="setup-success" hidden></div>
      <div id="setup-fields">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
          <div class="field-hint">At least 10 characters.</div>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
        </div>
        <button class="btn btn-block" type="submit">Set password</button>
      </div>
      <p class="small center"><a href="../index.html">Go to the login page</a></p>
    </form>
  </main>
  <script src="../shared/config.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="js/setup.js"></script>
</body>
</html>
